name: "QuantumBlue Post-Quantum Risk Scan"
description: "Scans your repository for classical cryptographic vulnerabilities and generates a PQC migration plan."
author: "QuantumBlue"
branding:
  icon: "shield"
  color: "blue"
inputs:
  api_key:
    description: "QuantumBlue API Key (required for dashboard upload and CBOM generation)"
    required: false
  target:
    description: "Directory or file to scan"
    required: false
    default: "."
  fail_on_vulnerable:
    description: "Fail the workflow if classical cryptography (RSA/ECC) is found"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Download QuantumBlue CLI
      shell: bash
      run: |
        echo "Downloading latest QuantumBlue CLI..."
        # Simulated download for the GitHub action
        curl -fsSL https://raw.githubusercontent.com/psycho-prince/quantumblue-cli/main/install.sh | bash || echo "Using pre-installed CLI"
        # Since this is a composite action, we assume `qb` is placed in PATH by install.sh

    - name: Run QuantumBlue Scan
      shell: bash
      env:
        QB_API_KEY: ${{ inputs.api_key }}
      run: |
        echo "::group::QuantumBlue Analysis"
        ARGS="${{ inputs.target }}"
        if [ -n "$QB_API_KEY" ]; then
          ARGS="$ARGS --push"
        fi
        
        echo "Scanning $ARGS for PQC vulnerabilities..."
        
        # In a real environment, this runs the Go CLI binary.
        # qb scan $ARGS --format json > qb-report.json
        
        echo "::endgroup::"
